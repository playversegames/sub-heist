function daily(){const today=Math.floor(sNow()/864e5);let day,can=true;if(S.dl===today){can=false;day=S.dd}else day=S.dl===today-1?S.dd%7+1:1;
  modal(`<h2>🎁 Daily reward</h2><p class="mut">Day ${day} of 7. Come back every day!</p><div class="days">${DR.map((tr,i)=>`<div class="day${i+1===day&&can?" on":""}${i+1<day||(i+1===day&&!can)?" dn":""}" style="color:${TI[tr][2]}">Day ${i+1}<br>${TI[tr][0]}</div>`).join("")}</div><button data-a="claim" ${can?"":"disabled"}>${can?"Claim reward":"Claimed today"}</button>`)}
function claim(){const today=Math.floor(sNow()/864e5);if(S.dl===today)return;const day=S.dl===today-1?S.dd%7+1:1,tr=DR[day-1],p=CR.filter(c=>c.t===tr),c=p[Math.random()*p.length|0],s=freeSlot();S.dl=today;S.dd=day;
  if(s>=0){S.own[s]={c:c.i,l:1};got(c.i);toast(`🎁 You got ${c.n}!`)}else{S.m+=c.price;toast(`Studio full. +$${fm(c.price)} instead`)}sv();modal("")}
function reb(){const req=25000*(S.rb+1)**2;modal(`<h2>♻️ Rebirth</h2><p class="mut">Restart with $200 plus $500 per rebirth, get +50% income per rebirth, and your base lock lasts 10 seconds longer each time.</p><p>Needs <b>$${fm(req)}</b> · you have $${fm(S.m)}</p><button data-a="rebgo" ${S.m<req?"disabled":""}>Rebirth now</button>`)}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,i=+t.dataset.i;
  if(a==="act"){if(t._f)t._f()}else if(a==="home"){const b=BA[me.i];me.x=b.x+b.w/2;me.y=b.y+b.h/2;grab=null}else if(a==="close")modal("");else if(a==="leave")leaveLobby();else if(a==="refresh")lobbyUI();else if(a==="google")gsign();else if(a==="join")joinLobby(t.dataset.id);else if(a==="create"){await ready;const id=push(ref(db,"lobbies")).key;await set(ref(db,`lobbies/${id}/meta`),{name:S.name+"'s lobby",t:sNow()});joinLobby(id)}else if(a==="guest"){const v=$("nm").value;if(v.trim().length<2)titleUI("Enter at least 2 letters");else{await ready;if(!(await claim(v)))titleUI("That name is taken. Choose another.");else{S.name=v.trim();sv();lobbyUI()}}}else if(a==="lock")lock();else if(a==="gal")gallery();else if(a==="gr")grClaim(i);else if(a==="daily")daily();else if(a==="claim")claim();else if(a==="reb")reb();
  else if(a==="lvl"){const o=S.own[i],uc=Math.floor(CR[o.c].price*.8*o.l);if(S.m>=uc&&o.l<5){S.m-=uc;o.l++;sv();manage(i)}}
  else if(a==="sell"){const o=S.own[i];S.m+=CR[o.c].price*.6*o.l;S.own[i]=null;sv();modal("")}
  else if(a==="rebgo"){const req=25000*(S.rb+1)**2;if(S.m>=req){S.rb++;S.m=200+S.rb*500;S.own=Array(6).fill(null);sv();modal("");toast("♻️ Reborn! Income x"+mult().toFixed(2))}}
  else if(a==="start"){started=true;modal("");try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();screen.orientation&&screen.orientation.lock&&screen.orientation.lock("landscape").catch(()=>{})}catch(e){}}});
if(S.name)lobbyUI();else titleUI();
requestAnimationFrame(loop);
</script></body></html>
