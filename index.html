function signScreen(msg){modal(`<h2>📺 Sub Heist</h2><p class="mut">Sign in with Google to play. Your name shows in the 👥 lobby for trades and steals. Only CPU and real players can steal!</p>${msg?`<p style="color:#ff8fb5">${esc(msg)}</p>`:""}<button data-a="gsign">🔐 Sign in with Google</button>`);$("modal").querySelector('[data-a="close"]').remove()}
function begin(u){if(started)return;AU=u;PN=String(u.displayName||"Player").split(" ")[0].slice(0,12);ls.set("sh2-name",PN);ls.set("sh2-uid",u.uid);connect();started=true;modal("");try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();screen.orientation&&screen.orientation.lock&&screen.orientation.lock("landscape").catch(()=>{})}catch(e){}}
async function doSign(){if(!auth||FBCFG.apiKey.startsWith("PASTE"))return signScreen("Sign-in is not set up yet: add your Firebase config at the top of the game file.");const pr=new GoogleAuthProvider();try{await signInWithPopup(auth,pr)}catch(e){const c=e&&e.code;if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment")signInWithRedirect(auth,pr);else if(c!=="auth/popup-closed-by-user"&&c!=="auth/cancelled-popup-request")signScreen("Sign-in failed. Please try again.")}}
signScreen();if(auth)onAuthStateChanged(auth,u=>{if(u)begin(u)});
requestAnimationFrame(loop);

let PN="Guest",room=null,pe=[],stealCd=0;const myId=Math.random().toString(36).slice(2,8),pub=()=>room&&room.presence({n:PN,id:myId,o:S.own.map(o=>o?o.c:null),lk:S.lk}).catch(()=>{});
async function connect(){try{room=await claude.use("room");if(!room)return;room.onPeers(c=>{pe=c.peers.filter(p=>!p.isMe&&p.presence&&p.presence.id)});
room.on("trade",m=>{const d=m.data;if(!d||d.to!==myId||!CR[d.give]||!CR[d.want])return;modal(`<h2>🤝 Trade offer</h2><p><b>${esc(String(d.fn).slice(0,12))}</b> gives <b>${esc(CR[d.give].n)}</b><br>for your <b>${esc(CR[d.want].n)}</b></p><button data-a="tok" data-d='${JSON.stringify({f:d.from,g:d.give,w:d.want})}'>Accept</button>`)});
room.on("tok",m=>{const d=m.data;if(!d||d.to!==myId)return;const s=S.own.findIndex(o=>o&&o.c===d.give);if(s<0)return;S.own[s]={c:d.want,l:1};pub();sv();toast("🤝 Trade done!")});
room.on("steal",m=>{const d=m.data;if(!d||d.to!==myId)return;const s=+d.s;if(Date.now()<S.lk||!S.own[s]||Math.random()<.35)return room.emit("denied",{to:d.from});const c=S.own[s].c;S.own[s]=null;pub();sv();toast(`🥷 Real player ${String(d.fn).slice(0,12)} stole ${CR[c].n}!`);room.emit("stolen",{to:d.from,c})});
room.on("stolen",m=>{const d=m.data;if(!d||d.to!==myId||!CR[d.c])return;const s=freeSlot();if(s>=0)S.own[s]={c:d.c,l:1};else S.m+=CR[d.c].price*.6;sv();toast(`✅ Stolen ${CR[d.c].n}!`)});
room.on("denied",m=>{if(m.data&&m.data.to===myId)toast("🚨 Caught! They kept it")});pub();setInterval(pub,4000)}catch(e){}}
function lobby(){modal(`<h2>👥 Lobby</h2><p class="mut">You: ${esc(PN)}. ${room?pe.length+" real player(s) online":"Online lobby unavailable, playing vs CPU"}</p>`+pe.map(p=>`<div class="pl"><span>${esc(String(p.presence.n).slice(0,12))}<br><span class="mut">${(p.presence.o||[]).filter(x=>x!=null).length} creators${Date.now()<p.presence.lk?" · 🔒":""}</span></span><span><button data-a="tmenu" data-id="${esc(p.presence.id)}">Trade</button> <button data-a="rsteal" data-id="${esc(p.presence.id)}">🥷</button></span></div>`).join("")+`<button class="g" data-a="gout">Sign out ${esc(AU&&AU.email||"")}</button>`)}
const nm=c=>CR[c]?CR[c].n:"?";
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=t.dataset.id,p=pe.find(x=>x.presence.id===id);
if(a==="lock")lock();else if(a==="lobby")lobby();
else if(a==="tmenu"&&p){const mine=S.own.map(o=>o?o.c:null).filter(x=>x!=null),th=(p.presence.o||[]).filter(x=>x!=null&&CR[x]);if(!mine.length||!th.length)return toast("Both need a creator to trade");modal(`<h2>🤝 Trade with ${esc(String(p.presence.n).slice(0,12))}</h2><p class="mut">You give</p><select id="tg">${mine.map(c=>`<option value="${c}">${esc(nm(c))}</option>`).join("")}</select><p class="mut">You get</p><select id="tw">${th.map(c=>`<option value="${c}">${esc(nm(c))}</option>`).join("")}</select><button data-a="tsend" data-id="${esc(id)}">Send offer</button>`)}
else if(a==="tsend"&&room){room.emit("trade",{to:id,from:myId,fn:PN,give:+$("tg").value,want:+$("tw").value});modal("");toast("Offer sent")}
else if(a==="tok"&&room){const d=JSON.parse(t.dataset.d),s=S.own.findIndex(o=>o&&o.c===d.w);modal("");if(s<0)return toast("You no longer own that");S.own[s]={c:d.g,l:1};room.emit("tok",{to:d.f,give:d.g,want:d.w});pub();sv();toast("🤝 Trade done!")}
else if(a==="rsteal"&&room&&p){if(Date.now()<stealCd)return toast("Wait a few seconds");if(Date.now()<p.presence.lk)return toast("🔒 Their base is locked");const l=(p.presence.o||[]).map((c,i)=>c!=null?i:-1).filter(i=>i>=0);if(!l.length)return toast("Nothing to steal");stealCd=Date.now()+15000;room.emit("steal",{to:id,from:myId,fn:PN,s:l[Math.random()*l.length|0]});modal("");toast("🥷 Stealing...")}});
setInterval(()=>{const b=$("lkb"),on=started&&inBase(me.i,me.x,me.y),lk=Date.now()<S.lk;b.style.display=on||lk?"block":"none";b.textContent=lk?`🔒 ${Math.ceil((S.lk-Date.now())/1000)}s · Home to leave`:`🔒 Lock base ${lockDur()}s`;document.querySelector('[data-a="lobby"]').textContent="👥"+pe.length},250);

const GL=[["Common–Epic",c=>c.t<4&&!EX.has(c.i),"Reward: Tune Series Titan (prestige)","Tune Series Titan"],["Legendary (18)",c=>c.t===4,"Reward: The Giveaway King (top prestige)","The Giveaway King"],["Special (8)",c=>c.t===5,"Hint: a secret top earner roams the road, 0.1%",null]];
function galTrack(){for(const a of[S.own,S.pm])for(const o of a)if(o)S.gal[o.c]=1;GL.forEach((G,k)=>{if(G[3]&&!S.gr[k]&&CR.filter(G[1]).every(c=>S.gal[c.i])){S.gr[k]=1;const c=CR.find(x=>x.n===G[3]),f=freeSlot();if(f>=0)S.own[f]={c:c.i,l:1};else S.m+=c.price;sv();toast("🏆 Gallery complete! "+c.n)}})}
setInterval(galTrack,1500);
function gallery(){modal("<h2>📖 Gallery</h2>"+GL.map(G=>{const L=CR.filter(G[1]),d=L.filter(c=>S.gal[c.i]).length;return`<div class="pl" style="display:block"><b>${G[0]} ${d}/${L.length}</b>${S.gr[GL.indexOf(G)]?" ✅":""}<br><span class="mut">${G[2]}</span><br><span style="font-size:.7rem">${L.map(c=>S.gal[c.i]?`<span style="color:${TI[c.t][2]}">${c.f} ${esc(c.n)}</span>`:"❓").join(" · ")}</span></div>`}).join("")+`<div class="pl">🌌 Secret: ${S.gal[SECRET]?"Mystic Sub God ✅":"???"}</div>`)}
function bmenu(){const uc=Math.floor(1500*S.bl**1.7);modal(`<h2>🏗️ Base Lv ${S.bl}/30</h2><p class="mut">Studio slots ${SL()}/10 (+1 every 6 levels)<br>Outside slots ${pmN()} (+1 per 5 rebirths)<br>Lock time ${lockDur()}s (+5s every 3 levels)</p><button data-a="bup" ${S.bl>=30||S.m<uc?"disabled":""}>${S.bl>=30?"Max level":"Upgrade $"+fm(uc)}</button>`)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=+t.dataset.id,k=t.dataset.k;
if(a==="gal")gallery();else if(a==="bm")bmenu();
else if(a==="bup"){const uc=Math.floor(1500*S.bl**1.7);if(S.bl<30&&S.m>=uc){S.m-=uc;S.bl++;sv();bmenu()}}
else if(a==="lv2"){const o=S[k][id],uc=o&&Math.floor(CR[o.c].price*.8*o.l);if(o&&S.m>=uc&&o.l<5){S.m-=uc;o.l++;sv();manage(id,k)}}
else if(a==="sell2"){const o=S[k][id];if(o){S.m+=CR[o.c].price*.6*o.l;S[k][id]=null;sv()}modal("")}
else if(a==="out"){const f=S.pm.findIndex((o,i)=>!o&&i<pmN());if(f>=0){S.pm[f]=S.own[id];S.own[id]=null;sv()}modal("")}
else if(a==="inn"){const f=freeSlot();if(f<0)return toast("Studio full");S.own[f]=S.pm[id];S.pm[id]=null;sv();modal("")}});
</script></body></html>
